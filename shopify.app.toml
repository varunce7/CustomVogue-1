# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9adf469185b975354ca9383c6ee1baea"
name = "MetaVogue"
handle = "metavogue"
application_url = "https://custom-vogue-1.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Keeps the app's view of the plan in step with Shopify: grants Growth the
  # moment a charge goes ACTIVE, and revokes it on CANCELLED / DECLINED /
  # EXPIRED / FROZEN (e.g. a failed payment) without waiting for a cache to expire.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app_subscriptions/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_themes"

[auth]
redirect_urls = [ "https://custom-vogue-1.vercel.app/api/auth" ]

[app_proxy]
url = "https://custom-vogue-1.vercel.app"
subpath = "custom-vogue"
prefix = "apps"

[product.metafields.custom_vogue.accordion_fields]
type = "json"
name = "Accordion Fields"
description = "JSON array of accordion items for the CustomVogue storefront block"

  [product.metafields.custom_vogue.accordion_fields.access]
  admin = "merchant_read_write"
  storefront = "public_read"
